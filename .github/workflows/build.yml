name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-latest
            configuration: Debug
            cmake_config: -DCMAKE_BUILD_TYPE=Debug
            toolchain: gcc
            consumer_config: -DCMAKE_BUILD_TYPE=Debug
          - name: Linux GCC Release
            os: ubuntu-latest
            configuration: Release
            cmake_config: -DCMAKE_BUILD_TYPE=Release
            toolchain: gcc
            consumer_config: -DCMAKE_BUILD_TYPE=Release
          - name: Windows MSVC Debug
            os: windows-latest
            configuration: Debug
            cmake_config: ""
            toolchain: msvc
            consumer_config: ""
          - name: Windows MSVC Release
            os: windows-latest
            configuration: Release
            cmake_config: ""
            toolchain: msvc
            consumer_config: ""
          - name: Windows MinGW GCC Debug
            os: windows-latest
            configuration: Debug
            toolchain: mingw
            consumer_config: -G Ninja -DCMAKE_BUILD_TYPE=Debug
            cmake_config: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
              -DENABLE_CLANG_TIDY=OFF
          - name: Windows MinGW GCC Release
            os: windows-latest
            configuration: Release
            toolchain: mingw
            consumer_config: -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake_config: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
              -DENABLE_CLANG_TIDY=OFF

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux GPU test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xauth \
            xvfb

      - name: Verify Windows MinGW toolchain
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build
          ${{ matrix.cmake_config }}
          -DVECTORGL_BUILD_EXAMPLES=OFF
          -DVECTORGL_BUILD_TESTS=ON
          -DVECTORGL_BUILD_GPU_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ matrix.configuration }} --prefix staging

      - name: Configure installed-package consumer
        run: >
          cmake
          -S tests/package_consumer
          -B package-consumer-build
          ${{ matrix.consumer_config }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/staging

      - name: Build installed-package consumer
        run: >
          cmake
          --build package-consumer-build
          --config ${{ matrix.configuration }}
          --parallel

      - name: Test installed-package consumer
        run: >
          ctest
          --test-dir package-consumer-build
          -C ${{ matrix.configuration }}
          --output-on-failure
