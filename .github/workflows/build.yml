name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux GCC Debug, os: ubuntu-24.04, preset: ci-headless, config: Debug, generator: Ninja, cc: gcc, cxx: g++}
          - {name: Linux GCC Release, os: ubuntu-24.04, preset: ci-headless, config: Release, generator: Ninja, cc: gcc, cxx: g++}
          - {name: Linux GCC Sanitizers, os: ubuntu-24.04, preset: sanitizers, config: Debug, generator: Ninja, cc: gcc, cxx: g++}
          - {name: Windows MSVC Debug, os: windows-latest, preset: ci-host, config: Debug, generator: default}
          - {name: Windows MSVC Release, os: windows-latest, preset: workspace, config: Release, generator: default}
          - {name: Windows MinGW GCC Debug, os: windows-latest, preset: ci-host, config: Debug, generator: Ninja, cc: gcc, cxx: g++}
          - {name: Windows MinGW GCC Release, os: windows-latest, preset: workspace, config: Release, generator: Ninja, cc: gcc, cxx: g++}
          - {name: Linux GPU and examples, os: ubuntu-24.04, preset: full, config: Debug, generator: Ninja, cc: gcc, cxx: g++}
          - {name: Graphics-only package without UI or GLFW, os: ubuntu-24.04, preset: library, config: Debug, generator: Ninja, cc: gcc, cxx: g++, embedded: ON}
          - {name: Clang-Tidy and Format, os: ubuntu-24.04, preset: quality, config: Debug, generator: Ninja, cc: clang-18, cxx: clang++-18}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build ccache
      - name: Install display build dependencies
        if: matrix.preset == 'full' || matrix.preset == 'quality'
        run: >-
          sudo apt-get install --yes libgl1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev xauth xvfb
      - name: Install pinned quality tools
        if: matrix.preset == 'quality'
        run: sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18
      # Cache source trees only. Never restore compiler-specific CMake caches or libraries.
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps/*-src
          key: deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Cache Linux compiler outputs
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: compiler-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.config }}-${{ matrix.cxx }}-${{ github.sha }}
          restore-keys: compiler-${{ runner.os }}-${{ matrix.preset }}-${{ matrix.config }}-${{ matrix.cxx }}-
      - name: Configure sanitizer runtime
        if: matrix.preset == 'sanitizers'
        shell: bash
        run: |
          echo "ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:strict_string_checks=1" >> "$GITHUB_ENV"
          echo "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1" >> "$GITHUB_ENV"
      - name: Configure, build, test and verify SDK
        run: >-
          cmake -DPRESET=${{ matrix.preset }} -DCONFIGURATION=${{ matrix.config }}
          "-DGENERATOR=${{ matrix.generator }}" "-DCC=${{ matrix.cc }}" "-DCXX=${{ matrix.cxx }}"
          "-DVERIFY_EMBEDDED=${{ matrix.embedded }}" -P scripts/ci-build.cmake
      - name: Compiler cache statistics
        if: always() && runner.os == 'Linux'
        run: ccache --show-stats
      - name: Upload test reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/**/results.xml
            build/**/Testing/Temporary/*.log
            build/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
