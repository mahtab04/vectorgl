name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-latest
            configuration: Debug
            cmake_config: -DCMAKE_BUILD_TYPE=Debug
          - name: Linux GCC Release
            os: ubuntu-latest
            configuration: Release
            cmake_config: -DCMAKE_BUILD_TYPE=Release
          - name: Windows MSVC Debug
            os: windows-latest
            configuration: Debug
            cmake_config: ""
          - name: Windows MSVC Release
            os: windows-latest
            configuration: Release
            cmake_config: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Install glad generator dependencies
        run: python -m pip install --disable-pip-version-check "jinja2>=3,<4"

      - name: Configure
        run: >
          cmake -S . -B build
          ${{ matrix.cmake_config }}
          -DPython_EXECUTABLE=${{ steps.python.outputs.python-path }}
          -DVECTORGL_BUILD_EXAMPLES=OFF
          -DVECTORGL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
