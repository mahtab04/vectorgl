name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-latest
            configuration: Debug
            cmake_config: -DCMAKE_BUILD_TYPE=Debug
            toolchain: gcc
          - name: Linux GCC Release
            os: ubuntu-latest
            configuration: Release
            cmake_config: -DCMAKE_BUILD_TYPE=Release
            toolchain: gcc
          - name: Windows MSVC Debug
            os: windows-latest
            configuration: Debug
            cmake_config: ""
            toolchain: msvc
          - name: Windows MSVC Release
            os: windows-latest
            configuration: Release
            cmake_config: ""
            toolchain: msvc
          - name: Windows MinGW GCC Debug
            os: windows-latest
            configuration: Debug
            toolchain: mingw
            cmake_config: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
              -DENABLE_CLANG_TIDY=OFF
          - name: Windows MinGW GCC Release
            os: windows-latest
            configuration: Release
            toolchain: mingw
            cmake_config: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
              -DENABLE_CLANG_TIDY=OFF

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Verify Windows MinGW toolchain
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build
          ${{ matrix.cmake_config }}
          -DVECTORGL_BUILD_EXAMPLES=OFF
          -DVECTORGL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
