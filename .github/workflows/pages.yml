name: Legacy website redirects

on:
  push:
    branches:
      - main
    paths:
      - ".github/pages-redirects/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy legacy URL redirects
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .github/pages-redirects

      - name: Deploy redirects
        id: deployment
        uses: actions/deploy-pages@v4
