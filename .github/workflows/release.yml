name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: SDK ${{ matrix.platform }} ${{ matrix.flavor }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64-gcc, flavor: core, preset: library-release, generator: Ninja}
          - {os: ubuntu-24.04, platform: linux-x64-gcc, flavor: full, preset: workspace-release, generator: Ninja}
          - {os: windows-latest, platform: windows-x64-msvc, flavor: core, preset: library-release, generator: default}
          - {os: windows-latest, platform: windows-x64-msvc, flavor: full, preset: workspace-release, generator: default}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux tools and host development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps/*-src
          key: deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Build and verify installed consumers
        run: >-
          cmake -DPRESET=${{ matrix.preset }} -DCONFIGURATION=Release
          "-DGENERATOR=${{ matrix.generator }}" -P scripts/ci-build.cmake
      - name: Archive, relocate and verify SDK
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $PWD 'build/${{ matrix.preset }}'
          $generatorLine = Get-Content (Join-Path $buildDirectory 'CMakeCache.txt') | Where-Object { $_ -match '^CMAKE_GENERATOR:INTERNAL=' }
          $generator = $generatorLine.Substring($generatorLine.IndexOf('=') + 1)
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '' }
          cmake "-DBUILD_DIR=$buildDirectory" "-DOUTPUT_DIR=$PWD/release-assets" "-DGENERATOR=$generator" -DCONFIGURATION=Release -DFLAVOR=${{ matrix.flavor }} -DPLATFORM=${{ matrix.platform }} "-DEXPECTED_TAG=$tag" -P scripts/package.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified archive and checksums
        uses: actions/upload-artifact@v6
        with:
          name: vectorgl-${{ matrix.platform }}-${{ matrix.flavor }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.flavor }}
          path: |
            build/**/results.xml
            build/**/Testing/Temporary/*.log
            build/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: vectorgl-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-assets/*
          --verify-tag --generate-notes --title "VectorGL ${{ github.ref_name }}"
