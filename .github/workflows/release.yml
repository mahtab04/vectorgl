name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            cmake_config: -DCMAKE_BUILD_TYPE=Release
          - platform: windows-x64
            os: windows-latest
            cmake_config: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Linux OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Install glad generator dependencies
        run: python -m pip install --disable-pip-version-check "jinja2>=3,<4"

      - name: Configure
        run: >
          cmake -S . -B build
          ${{ matrix.cmake_config }}
          -DPython_EXECUTABLE=${{ steps.python.outputs.python-path }}
          -DVECTORGL_BUILD_EXAMPLES=OFF
          -DVECTORGL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix staging

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/vectorgl-${{ github.ref_name }}-linux-x64.tar.gz" -C staging .

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path staging\* -DestinationPath "release-assets\vectorgl-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: vectorgl-${{ github.ref_name }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: vectorgl-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --verify-tag
          --generate-notes
          --title "VectorGL ${{ github.ref_name }}"
